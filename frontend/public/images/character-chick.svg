<!--
  キャラクター(ひよこ)の仮アセット。
  デザイン確定後にこのファイルを差し替えるだけで反映される。
  色は styles/global.css の :root と揃えてある。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="ひよこ">
  <defs>
    <linearGradient id="chick-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE9A8"/>
      <stop offset="100%" stop-color="#FFD25E"/>
    </linearGradient>
  </defs>

  <!-- 割れた殻 -->
  <path d="M34 118 q46 22 92 0 l-6 20 q-40 12 -80 0 z" fill="#F7FAFE" stroke="#E3ECF5" stroke-width="3" stroke-linejoin="round"/>

  <!-- 体 -->
  <ellipse cx="80" cy="86" rx="40" ry="42" fill="url(#chick-body)"/>

  <!-- 羽 -->
  <path d="M44 92 q-12 6 -4 18 q10 2 14 -10 z" fill="#FFD25E"/>
  <path d="M116 92 q12 6 4 18 q-10 2 -14 -10 z" fill="#FFD25E"/>

  <!-- 顔 -->
  <circle cx="68" cy="80" r="4" fill="#2C2C2A"/>
  <circle cx="92" cy="80" r="4" fill="#2C2C2A"/>
  <path d="M80 90 l-8 6 l8 6 l8 -6 z" fill="#F5A623"/>

  <!-- 頭の毛 -->
  <path d="M80 44 q-4 -12 4 -16 q-2 10 6 14" fill="none" stroke="#FFD25E" stroke-width="4" stroke-linecap="round"/>
</svg>
