<!--
  キャラクター(たまご)の仮アセット。
  デザイン確定後にこのファイルを差し替えるだけで反映される。
  色は styles/global.css の :root と揃えてある。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" role="img" aria-label="たまご">
  <defs>
    <linearGradient id="egg-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#F7FAFE"/>
    </linearGradient>
  </defs>

  <ellipse cx="80" cy="88" rx="46" ry="56" fill="url(#egg-body)" stroke="#E3ECF5" stroke-width="3"/>

  <!-- 模様 -->
  <circle cx="62" cy="96" r="7" fill="#eaf1ff"/>
  <circle cx="96" cy="82" r="5" fill="#f2edfb"/>
  <circle cx="84" cy="112" r="6" fill="#eaf1ff"/>

  <!-- 顔 -->
  <circle cx="69" cy="78" r="3.5" fill="#2C2C2A"/>
  <circle cx="91" cy="78" r="3.5" fill="#2C2C2A"/>
  <path d="M74 90 q6 5 12 0" fill="none" stroke="#2C2C2A" stroke-width="2.5" stroke-linecap="round"/>
</svg>
